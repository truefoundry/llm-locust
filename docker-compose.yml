# Local orchestration: master + scalable workers
# Usage: docker compose up --scale worker=10 -d

services:
  master:
    build: .
    # ENTRYPOINT is `locust`; only pass flags here (not `locust` again).
    command: ["--master"]
    ports:
      - "8089:8089"
    env_file: .env
    environment:
      - LOCUST_HOST=${LOCUST_HOST:-https://api.openai.com}

  worker:
    build: .
    command: ["--worker", "--master-host=master"]
    env_file: .env
    environment:
      - LOCUST_HOST=${LOCUST_HOST:-https://api.openai.com}
    depends_on:
      - master
