# Locust configuration (defaults for local runs)
# TrueFoundry uses command-line args; this file is reference for local execution.

# Target host: LLM gateway base URL for chat completions
# Override with --host or LOCUST_HOST env (e.g. in .env or TrueFoundry service env)
host = https://vedantaz.devtest.truefoundry.tech/api/llm

# User count and spawn rate (override with -u / --users and -r / --spawn-rate)
users = 100
spawn-rate = 10

# Web UI
web-host = 0.0.0.0
web-port = 8089

# Log level
loglevel = INFO
